[package]
name = "tiny-business-simulator"
version = "0.1.0-alpha.1"
edition = "2021"

authors = ["David Valin <hola@davidvalin.com>"]
homepage = "https://github.com/DavidValin/tiny-business-simulator"
repository = "https://github.com/DavidValin/tiny-business-simulator"
description = "A simple .txt file business simulator that allows you to setup financial goals and see the targets you will need to meet to achieve your business goal"
license-file = "LICENSE"
readme = "README.md"

[[bin]]
name = "tiny-business-simulator"
path = "src/cli.rs"

[dependencies]
dialoguer = "0.11"
rand = "0.8"
ratatui = "0.30"
crossterm = "0.29"
